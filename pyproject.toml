[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "delm-cb"
version = "0.1.0"
description = "Zero-invasion DeLM shared-context evaluation package for CooperBench"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"

[project.scripts]
delm-cb = "delm_cb.cli:main"

[tool.setuptools]
packages = ["delm_cb", "board"]

[tool.setuptools.package-dir]
"" = "src"
"board" = "vendor/delm/board"

[tool.setuptools.package-data]
board = ["context.sh"]

[tool.pytest.ini_options]
pythonpath = ["src", "vendor/delm"]
testpaths = ["tests"]
